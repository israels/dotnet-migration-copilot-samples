<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Defense-in-depth: the data island is built from untrusted source. Allow only
     inline script/style (the viewer is self-contained) and block network egress, so
     even a breakout cannot exfiltrate. The injector also escapes < > & in the data. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>System topology</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --panel-2: #2d2d2d;
    --text: #d4d4d4; --muted: #8a8a8a; --accent: #cc785c;
    --border: #3a3a3a; --blue: #5ba0e0; --green: #6bb85a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg);
    color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; cursor: grab; }
  #map.dragging { cursor: grabbing; }

  #hud { position: absolute; top: 12px; left: 12px; width: 280px;
    display: flex; flex-direction: column; gap: 8px; z-index: 2; }
  .panel { background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; }
  .panel h1 { font-size: 15px; color: var(--accent); margin-bottom: 2px; }
  .panel .sub { color: var(--muted); font-size: 12px; }
  #search { width: 100%; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); font: inherit; outline: none; }
  #search:focus { border-color: var(--accent); }
  #results { max-height: 180px; overflow-y: auto; margin-top: 4px; }
  #results div { padding: 4px 6px; border-radius: 4px; cursor: pointer;
    font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #results div:hover { background: var(--panel-2); }
  #results .kind { color: var(--muted); font-size: 11px; margin-left: 6px; }

  .toggles label { display: flex; align-items: center; gap: 7px;
    font-size: 13px; padding: 2px 0; cursor: pointer; }
  .swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  #flows select { width: 100%; margin-top: 4px; padding: 5px;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font: inherit; }

  #sidebar { position: absolute; top: 12px; right: 12px; bottom: 12px;
    width: 320px; overflow-y: auto; z-index: 2; display: none; }
  #sidebar.open { display: block; }
  #sidebar h2 { font-size: 16px; word-break: break-word; }
  #sidebar .meta { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
  #sidebar .desc { font-size: 13px; margin: 0 0 10px; }
  #sidebar .desc .cap { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
  #sidebar h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin: 12px 0 4px; }
  #sidebar .link { color: var(--blue); cursor: pointer; display: block;
    padding: 2px 0; font-size: 13px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  #sidebar .link:hover { color: var(--accent); }
  #sidebar ol { padding-left: 20px; } #sidebar ol li { margin: 6px 0; font-size: 13px; }
  #sidebar .closebtn { float: right; cursor: pointer; color: var(--muted);
    font-size: 18px; line-height: 1; } #sidebar .closebtn:hover { color: var(--text); }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 9px;
    font-size: 11px; border: 1px solid var(--border); color: var(--muted); margin-right: 4px; }
  .badge.entry { border-color: var(--accent); color: var(--accent); }

  #hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    color: var(--muted); font-size: 12px; z-index: 2; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; }
  #err { position: absolute; inset: 0; display: none; place-items: center; z-index: 9; }
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="hud">
  <div class="panel">
    <h1 id="title">System topology</h1>
    <div class="sub" id="stats"></div>
  </div>
  <div class="panel">
    <input id="search" type="search" placeholder="Search modules, stores, jobs…" autocomplete="off">
    <div id="results"></div>
  </div>
  <div class="panel toggles" id="toggles"></div>
  <div class="panel" id="flows" style="display:none">
    <div class="sub">Business flow walkthrough</div>
    <select id="flowSel"><option value="">— none —</option></select>
  </div>
  <details class="panel" id="obs" style="display:none">
    <summary style="cursor:pointer;color:var(--muted);font-size:12px">Architect observations</summary>
    <ul id="obsList" style="padding-left:18px;margin-top:6px;font-size:12.5px"></ul>
  </details>
</div>

<aside id="sidebar" class="panel"></aside>
<div id="hint">scroll to zoom · drag to pan · click a node · double-click to zoom in · Esc to reset</div>
<div id="err" class="panel"><p>No topology data found in this file.<br>
Re-run <code>/code-modernization:modernize-map</code> to regenerate it.</p></div>

const DATA = /*__TOPOLOGY_DATA__*/ {"system": "Contoso University", "root": {"id": "sys", "name": "contoso", "kind": "system", "children": [{"id": "dom:platform", "name": "Startup and Shell", "kind": "domain", "children": [{"id": "Global.asax.cs", "name": "Global.asax.cs", "kind": "module", "loc": 33, "file": "Global.asax.cs", "language": "csharp", "description": "Global.asax.cs is the application's startup entry point. It runs once when the web application launches, sets up the site's request handling, page routing and bundled scripts and styles, and then prepares the school database before any users arrive. During startup it calls FilterConfig, RouteConfig and BundleConfig. It reads the \"DefaultConnection\" connection string from Web.config, uses it to open a SchoolContext, and passes that context to DbInitializer. The packet lists no inbound connections, which fits a module the hosting runtime starts directly."}, {"id": "RouteConfig", "name": "RouteConfig", "kind": "module", "loc": 17, "file": "App_Start/RouteConfig.cs", "language": "csharp", "description": "RouteConfig is the application's address book. It decides which part of the Contoso University system answers each web request, and it sends visitors to the Home page's Index screen when no address is given. This 17-line C# module (App_Start/RouteConfig.cs) sets up one \"Default\" route with the pattern {controller}/{action}/{id} and skips .axd resource requests. Global.asax.cs calls it at startup, and it sends requests on to CoursesController, DepartmentsController, HomeController, InstructorsController, NotificationsController and StudentsController."}, {"id": "FilterConfig", "name": "FilterConfig", "kind": "module", "loc": 13, "file": "App_Start/FilterConfig.cs", "language": "csharp", "description": "FilterConfig (App_Start/FilterConfig.cs, 13 lines of C#) is a small setup module that decides which rules apply to every page request. Through RegisterGlobalFilters it turns on one rule, HandleErrorAttribute, which applies standard error handling across the application. A line that would have required login on every page through AuthorizeAttribute is commented out, so this module enforces no global sign-in rule. Global.asax.cs calls FilterConfig, and FilterConfig dispatches to Views/Shared."}, {"id": "BundleConfig", "name": "BundleConfig", "kind": "module", "loc": 22, "file": "App_Start/BundleConfig.cs", "language": "csharp", "description": "BundleConfig is a small, 22-line startup module (App_Start/BundleConfig.cs). It groups the website's shared browser scripts and stylesheets into named packages so that every page gets a consistent look and the same client-side form validation. Its RegisterBundles method defines four script bundles, for jquery, jqueryval, modernizr and bootstrap, and one style bundle, ~/Content/css, built from bootstrap.css and site.css. It makes no outbound calls. Global.asax.cs calls it at startup. Views/Courses, Views/Departments, Views/Instructors, Views/Shared and Views/Students call it when they render pages."}, {"id": "Web.config", "name": "Web.config", "kind": "module", "loc": 132, "file": "Web.config", "language": "xml", "description": "Web.config is the application's central settings file, 132 lines of XML. It names the database connection (DefaultConnection) and the notification queue location (NotificationQueuePath). It also sets limits on request size and execution time, targets framework 4.8 and pins which versions of supporting libraries load. Debug compilation is currently enabled. It calls nothing itself (no outbound connections). Three components read it: Global.asax.cs, NotificationService and SchoolContextFactory. The packet does not show which settings each one uses."}, {"id": "BaseController", "name": "BaseController", "kind": "module", "loc": 43, "file": "Controllers/BaseController.cs", "language": "csharp", "description": "BaseController is the shared foundation for the application's screens. It gives each one the same database access and the same way of announcing changes to records, such as a course or student being created or updated. Notifications are always recorded under the user \"System\", since the code notes there is no authentication. A failed notification is only logged and does not stop the user's action. It calls SchoolContextFactory to open a SchoolContext and calls NotificationService. It is called by CoursesController, DepartmentsController, HomeController, InstructorsController, NotificationsController and StudentsController."}, {"id": "Views/Shared", "name": "Views/Shared", "kind": "screen", "loc": 58, "file": "Views/Shared", "language": "razor", "description": "Views/Shared is the common look and feel for every Contoso University screen. It supplies the page frame, the navigation menu, the footer and a standard \"An error occurred while processing your request\" page. The menu sends users to HomeController, StudentsController, CoursesController, InstructorsController, DepartmentsController and NotificationsController. The frame calls BundleConfig to load styles and scripts, and it also loads notifications.js. FilterConfig sends errors here. The packet shows no data read or written by this 58-line razor screen."}, {"id": "ErrorViewModel", "name": "ErrorViewModel", "kind": "module", "loc": 9, "file": "Models/ErrorViewModel.cs", "language": "csharp", "description": "ErrorViewModel is a small data holder (9 lines of C# in Models/ErrorViewModel.cs, in the ContosoUniversity.Models namespace) that carries details about an application error so they can be shown to the user. It holds a RequestId value and a ShowRequestId flag, which is true only when a RequestId is present. The dependency map shows no outbound connections and no inbound connections, and it flags this node as a dead end. That means nothing in the mapped code calls it, reads it or writes it. The packet is too thin to say whether any error page actually uses it."}, {"id": "LoggingService", "name": "LoggingService", "kind": "module", "loc": 0, "file": "Services/LoggingService.cs", "language": "csharp", "description": "LoggingService is a C# module in Services/LoggingService.cs. Its name suggests it was meant to record application activity, but the packet does not confirm that: the file has 0 lines of code and no header comment, so its business purpose cannot be established. The dependency map shows no outbound connections, meaning it calls, reads and writes nothing. It also shows no inbound connections, so no other component calls it, and it is flagged as a dead end. The packet is too thin to say more than that this is an empty, unused placeholder."}]}, {"id": "dom:data", "name": "Data Access", "kind": "domain", "children": [{"id": "SchoolContext", "name": "SchoolContext", "kind": "module", "loc": 67, "file": "Data/SchoolContext.cs", "language": "csharp", "description": "SchoolContext is the application's central gateway to the university database. It defines which records the system keeps, such as courses, departments, enrollments, students, instructors and notifications, and how each maps to a table. Students and Instructors share a single Person table. It references nine entities: Course, CourseAssignment, Department, Enrollment, Instructor, Notification, OfficeAssignment, Person and Student. BaseController, DbInitializer, Global.asax.cs and SchoolContextFactory all call it, so many parts of the application depend on it."}, {"id": "SchoolContextFactory", "name": "SchoolContextFactory", "kind": "module", "loc": 15, "file": "Data/SchoolContextFactory.cs", "language": "csharp", "description": "SchoolContextFactory is a small 15-line C# module that gives the application its single, consistent way to open a connection to the school database. Every part of the system that needs student or course data goes through it, so all of them reach the same database the same way. Its one method, Create, reads the \"DefaultConnection\" setting from Web.config, configures it for SQL Server, and returns a new SchoolContext, which is the object it calls. BaseController calls it, so controllers reach their data through this factory. The packet lists no flags."}, {"id": "DbInitializer", "name": "DbInitializer", "kind": "module", "loc": 235, "file": "Data/DbInitializer.cs", "language": "csharp", "description": "DbInitializer (Data/DbInitializer.cs, 235 lines) loads starter data into the school database. If the database is empty, it fills it with sample students, instructors, departments, courses and office assignments, so the application has realistic records to show. If it finds any existing students, it stops and changes nothing. Its only caller is Global.asax.cs. It calls SchoolContext and the Student, Instructor, Department, Course, OfficeAssignment, CourseAssignment and Enrollment models. It writes to the Person, Department, Course, OfficeAssignment, CourseAssignment and Enrollment data stores."}, {"id": "PaginatedList", "name": "PaginatedList", "kind": "module", "loc": 25, "file": "PaginatedList.cs", "language": "csharp", "description": "PaginatedList is a small shared helper (25 lines of C#, in PaginatedList.cs) that splits long lists of records into pages, so users can browse results one screen at a time. It counts the total records, works out TotalPages, keeps track of the current PageIndex, and reports whether there is a previous or next page. Its Create method takes a query, skips the earlier pages and returns only the requested page. It has no outbound connections and doesn't read or write data stores itself. Its only listed caller is StudentsController."}, {"id": "Person", "name": "Person", "kind": "module", "loc": 26, "file": "Models/Person.cs", "language": "csharp", "description": "Person is the shared record for anyone the university tracks by name. It holds an ID, a required Last Name and a required First Name (stored in the FirstName column), each limited to 50 characters, and it builds a Full Name in the form \"Last Name, First Name\". It is an abstract base model of 26 lines of code in Models/Person.cs, so the system never uses it on its own. It has no outbound connections. It is called by Instructor, Student and SchoolContext, which reuse its common identity and naming rules."}]}, {"id": "dom:students", "name": "Students", "kind": "domain", "children": [{"id": "StudentsController", "name": "StudentsController", "kind": "module", "loc": 207, "file": "Controllers/StudentsController.cs", "language": "csharp", "description": "StudentsController is the entry point for managing student records. Staff can list students with search, sorting and pages of 10, view a student's details along with their enrollments and courses, and create or edit students, with checks that the enrollment date falls between 1753 and 9999. It inherits from BaseController and calls Student, Enrollment, Course, PaginatedList and NotificationService. It reads ds:Person, ds:Enrollment and ds:Course, writes ds:Person, and dispatches to Views/Students. RouteConfig, Views/Home, Views/Notifications, Views/Shared and Views/Students dispatch to it."}, {"id": "Views/Students", "name": "Views/Students", "kind": "screen", "loc": 267, "file": "Views/Students", "language": "razor", "description": "Views/Students is the set of screens staff use to manage student records. It covers listing students with a name search (\"Find by name\") and sorting, plus Create, Details, Edit and Delete pages showing fields such as LastName, FirstMidName and EnrollmentDate. It is a razor screen of 267 lines with no flags. StudentsController dispatches to it, and its forms and links dispatch back to StudentsController. It also calls BundleConfig."}, {"id": "Student", "name": "Student", "kind": "module", "loc": 18, "file": "Models/Student.cs", "language": "csharp", "description": "Student is the data model for a student at Contoso University. It is a small 18-line C# module in Models/Student.cs that builds on the shared Person record. It requires an Enrollment Date, which must fall between 1753 and 9999 and is displayed as yyyy-MM-dd, and it holds the student's collection of Enrollments. On the outbound side it references Person and Enrollment. On the inbound side it is used by DbInitializer, Enrollment, SchoolContext and StudentsController, which is how student records are seeded, stored, linked to enrollments and shown to users."}, {"id": "Enrollment", "name": "Enrollment", "kind": "module", "loc": 18, "file": "Models/Enrollment.cs", "language": "csharp", "description": "Enrollment is the record that a Student is enrolled in a Course. Each record carries an EnrollmentID, CourseID, StudentID and an optional Grade from A to F. When no grade is set, the screen shows \"No grade\". It is a small 18-line C# module in Models/Enrollment.cs. It links out to Course and Student. Six components use it: Course, Student, SchoolContext, DbInitializer, InstructorIndexData and StudentsController. The packet lists these links only as calls, so it does not show which ones read or write enrollment data."}]}, {"id": "dom:courses", "name": "Courses and Uploads", "kind": "domain", "children": [{"id": "CoursesController", "name": "CoursesController", "kind": "module", "loc": 232, "file": "Controllers/CoursesController.cs", "language": "csharp", "description": "CoursesController is the entry point for managing the course catalogue: users list, view, create and edit courses, assign each to a department, and optionally attach a teaching-material image (jpg, jpeg, png, gif or bmp, under 5MB). It builds on BaseController, uses Course, Department and NotificationService (a notification follows course creation), reads and writes ds:Course, reads ds:Department, and saves uploads to ds:Disk:Uploads/TeachingMaterials. RouteConfig dispatches requests to it; it renders Views/Courses, and Views/Courses, Views/Home, Views/Notifications and Views/Shared dispatch back to it."}, {"id": "Views/Courses", "name": "Views/Courses", "kind": "screen", "loc": 287, "file": "Views/Courses", "language": "razor", "description": "Views/Courses is the set of screens staff use to manage the course catalogue. They list courses and let staff create, view details of, edit and delete a course, with fields such as CourseID, Title, Credits, department name and Teaching Material. Create and Edit submit forms, including file uploads, to CoursesController, which also dispatches to these screens. The 287-line Razor view folder calls BundleConfig for page assets and reads teaching-material files from the disk store Uploads/TeachingMaterials."}, {"id": "Course", "name": "Course", "kind": "module", "loc": 23, "file": "Models/Course.cs", "language": "csharp", "description": "Course is the data model for a university course offering. It holds the course number, a title of 3 to 50 characters, a credit value from 0 to 5, the owning department and an optional path to a teaching material image of up to 255 characters. It links out to Department, Enrollment and CourseAssignment. It is used by CoursesController, InstructorsController, StudentsController, SchoolContext, DbInitializer and InstructorIndexData, and also by Department, Enrollment and CourseAssignment."}]}, {"id": "dom:faculty", "name": "Instructors and Departments", "kind": "domain", "children": [{"id": "InstructorsController", "name": "InstructorsController", "kind": "module", "loc": 233, "file": "Controllers/InstructorsController.cs", "language": "csharp", "description": "InstructorsController is an entry point for managing university instructors. Staff use it to list, view, create and edit instructor records, including their office and course assignments. It inherits from BaseController and builds InstructorIndexData and AssignedCourseData view models from the Instructor, Course, CourseAssignment, Department and OfficeAssignment models. It sends change alerts through NotificationService. It reads ds:Course and writes ds:Person, ds:OfficeAssignment, ds:CourseAssignment and ds:Department. RouteConfig and Views/Home, Views/Instructors, Views/Notifications and Views/Shared dispatch to it, and it renders Views/Instructors."}, {"id": "DepartmentsController", "name": "DepartmentsController", "kind": "module", "loc": 155, "file": "Controllers/DepartmentsController.cs", "language": "csharp", "description": "DepartmentsController is an entry point that lets staff list, view, create, edit and delete academic departments, including each department's Name, Budget, StartDate and administrator. It also warns users when someone else changed the same record at the same time. It builds on BaseController, uses the Department model, and calls NotificationService to announce new and updated departments. It reads ds:Department and ds:Person, writes ds:Department, and dispatches to Views/Departments. Requests reach it from RouteConfig, Views/Departments, Views/Notifications and Views/Shared."}, {"id": "Views/Instructors", "name": "Views/Instructors", "kind": "screen", "loc": 350, "file": "Views/Instructors", "language": "razor", "description": "Views/Instructors is the set of screens staff use to manage instructor records. Users can list instructors, showing last name, first name, hire date, office and courses, and can create, view details of, edit and delete individual instructors. The create and edit forms check what users enter and use anti-forgery tokens. The node is a Razor screen of about 350 lines. InstructorsController dispatches to it, and its forms and links dispatch back to InstructorsController. It also calls BundleConfig."}, {"id": "Views/Departments", "name": "Views/Departments", "kind": "screen", "loc": 230, "file": "Views/Departments", "language": "razor", "description": "Views/Departments is the set of Razor screens (230 lines of code) where staff manage the university's departments. They can list departments and see each one's Name, Budget, StartDate and Administrator. They can also create, view details of, edit and delete a department. The Edit screen carries RowVersion, and the Delete screen shows a ConcurrencyErrorMessage, so it appears to warn users when someone else changed the same record. DepartmentsController dispatches to these screens, and the screens dispatch back to DepartmentsController. They also call BundleConfig."}, {"id": "Instructor", "name": "Instructor", "kind": "module", "loc": 19, "file": "Models/Instructor.cs", "language": "csharp", "description": "Instructor is the data model for a teaching staff member at the university. It builds on the shared Person record and adds a required Hire Date, which must fall between 1753 and 9999. Each instructor is linked to the courses they teach and to their office. In the dependency map it calls CourseAssignment, OfficeAssignment and Person. It is called by CourseAssignment, DbInitializer, Department, InstructorIndexData, InstructorsController, OfficeAssignment and SchoolContext, so it sits at the center of instructor data flows."}, {"id": "Department", "name": "Department", "kind": "module", "loc": 25, "file": "Models/Department.cs", "language": "csharp", "description": "Department is the data model for an academic department in Models/Department.cs. It holds a Name of 3 to 50 characters, a Budget stored as money, a Start Date, an optional InstructorID linking to an Administrator, a RowVersion timestamp, and the department's Courses. It has outbound connections to Course and Instructor. It is called by Course, CoursesController, DbInitializer, DepartmentsController, InstructorsController and SchoolContext, so it sits at the center of how courses, instructors and departments relate."}, {"id": "OfficeAssignment", "name": "OfficeAssignment", "kind": "module", "loc": 14, "file": "Models/OfficeAssignment.cs", "language": "csharp", "description": "OfficeAssignment records which office each instructor occupies. It is a small 14-line C# data model in Models/OfficeAssignment.cs. Each record is keyed by InstructorID and holds an \"Office Location\" of up to 50 characters, so each instructor can have at most one office entry. The only thing it calls is Instructor, through a navigation property that links each office to its instructor. It is called by Instructor, InstructorsController, SchoolContext and DbInitializer. That means it is used when instructors are managed, when data is saved and loaded, and when the database is first seeded. The packet lists no flags."}, {"id": "CourseAssignment", "name": "CourseAssignment", "kind": "module", "loc": 14, "file": "Models/CourseAssignment.cs", "language": "csharp", "description": "CourseAssignment is a small C# data model (14 lines, Models/CourseAssignment.cs) that records which instructor teaches which course. It links the two by holding an InstructorID and a CourseID. It has no logic of its own and no header comment. It points out to Course and Instructor through navigation properties. Five components point to it: Course, Instructor, InstructorsController, SchoolContext and DbInitializer. That is where instructor-to-course assignments are managed, stored and seeded. The packet lists no flags."}, {"id": "InstructorIndexData", "name": "InstructorIndexData", "kind": "module", "loc": 10, "file": "Models/SchoolViewModels/InstructorIndexData.cs", "language": "csharp", "description": "InstructorIndexData is a small, 10-line C# view model in Models/SchoolViewModels/InstructorIndexData.cs. It bundles three lists into one package for the instructor overview screen: instructors, the courses they teach and the enrollments in those courses. It contains no business logic or data access of its own. The dependency map shows call links from it to Course, Enrollment and Instructor, which are the types of its three lists. Its only inbound connection is from InstructorsController, which presumably fills it in and passes it to the screen."}, {"id": "AssignedCourseData", "name": "AssignedCourseData", "kind": "module", "loc": 9, "file": "Models/SchoolViewModels/AssignedCourseData.cs", "language": "csharp", "description": "AssignedCourseData is a small view model (9 lines of C#, in Models/SchoolViewModels/AssignedCourseData.cs) that describes one course in relation to an instructor. It holds a CourseID, the course Title, and an Assigned flag that shows whether the course is currently assigned. In business terms, it appears to support screens where staff choose which courses an instructor teaches. The packet lists no outbound connections, so it calls, reads and writes nothing. Its only inbound connection is a call from InstructorsController. The packet does not show how that controller uses it."}]}, {"id": "dom:notifications", "name": "Notifications (MSMQ)", "kind": "domain", "children": [{"id": "NotificationService", "name": "NotificationService", "kind": "module", "loc": 107, "file": "Services/NotificationService.cs", "language": "csharp", "description": "NotificationService is the application's change-alert channel. When records are created, updated or deleted, it writes a readable message and puts it on a queue so users can later see what changed. It builds a Notification, reads its queue setting from Web.config, and both writes to and reads from the MSMQ queue ContosoUniversityNotifications. It is called by BaseController, CoursesController, DepartmentsController, InstructorsController, NotificationsController and StudentsController."}, {"id": "NotificationsController", "name": "NotificationsController", "kind": "module", "loc": 59, "file": "Controllers/NotificationsController.cs", "language": "csharp", "description": "NotificationsController is an entry point that gives administrators their notification feed. It serves an admin notification dashboard and fetches pending notifications from a queue, returning at most 10 at a time so the screen isn't flooded. It also lets a user mark a notification as read. It inherits from BaseController and calls NotificationService, which receives the notifications and marks them read, to handle Notification items. It renders Views/Notifications. Dispatches reach it from RouteConfig, Views/Notifications, Views/Shared and notifications.js."}, {"id": "Views/Notifications", "name": "Views/Notifications", "kind": "screen", "loc": 99, "file": "Views/Notifications", "language": "razor", "description": "Views/Notifications is the 99-line Razor screen titled \"Admin Notifications\". It tells administrators that they get real-time alerts when Students, Courses, Instructors or Departments are created, updated or deleted. It also describes delivery through Microsoft Message Queuing (MSMQ), with a check interval of 5 seconds and at most 5 notifications visible at a time. That description is fixed page text, not code that runs in this view. NotificationsController renders it. Its \"Create\" links dispatch to StudentsController, CoursesController, InstructorsController and DepartmentsController, and it also dispatches to NotificationsController."}, {"id": "notifications.js", "name": "notifications.js", "kind": "module", "loc": 129, "file": "Scripts/notifications.js", "language": "javascript", "description": "notifications.js is the browser-side Notification System for Admin Users. It checks for new activity every 5 seconds and shows an on-screen alert for each change, giving the operation (such as CREATE or DELETE), entity type, message, author and time. It keeps at most 5 alerts visible and removes each one after 1 minute. Views/Shared calls it, and it sends its requests to NotificationsController through /Notifications/GetNotifications. The excerpt puts server-supplied text into the page without escaping, which should be reviewed."}, {"id": "Notification", "name": "Notification", "kind": "module", "loc": 37, "file": "Models/Notification.cs", "language": "csharp", "description": "Notification is the record the system keeps when a university entity is created, updated or deleted. Each record holds the EntityType, the EntityId, the Operation (CREATE, UPDATE or DELETE), a Message of up to 256 characters, CreatedAt and CreatedBy, and an IsRead flag with a ReadAt time, so staff can tell which alerts they have seen. It is a 37-line C# data model in Models/Notification.cs. It makes no outbound calls. NotificationService, NotificationsController and SchoolContext call it."}]}, {"id": "dom:home", "name": "Home and Reporting", "kind": "domain", "children": [{"id": "HomeController", "name": "HomeController", "kind": "module", "loc": 41, "file": "Controllers/HomeController.cs", "language": "csharp", "description": "HomeController is an entry point that runs the application's general public pages: the landing page (Index), an About page that counts students by enrollment date, a Contact page, an Error page, and an Unauthorized page that tells users they lack permission. It inherits from BaseController and builds EnrollmentDateGroup summaries from student data, which reads the ds:Person data store. It sends its output to Views/Home. RouteConfig and Views/Shared route requests to it."}, {"id": "Views/Home", "name": "Views/Home", "kind": "screen", "loc": 63, "file": "Views/Home", "language": "razor", "description": "Views/Home is the public front door of the Contoso University application, a set of Razor screens totaling 63 lines. It holds a welcome Home Page, a Contact page with the university's address and its Support and Marketing addresses, and a \"Student Body Statistics\" page that shows how many students enrolled on each Enrollment Date. HomeController is the only caller that dispatches to these screens. From the Home Page, users go through to StudentsController, CoursesController and InstructorsController to manage students, courses and instructors."}, {"id": "EnrollmentDateGroup", "name": "EnrollmentDateGroup", "kind": "module", "loc": 11, "file": "Models/SchoolViewModels/EnrollmentDateGroup.cs", "language": "csharp", "description": "EnrollmentDateGroup is a small view model, 11 lines of C# in Models/SchoolViewModels/EnrollmentDateGroup.cs. It carries summary figures that show how many students enrolled on a given date. It has two fields: an optional EnrollmentDate, marked as a date for display, and a StudentCount. It doesn't call, read or write any other part of the system, since it has no outbound connections. Its only inbound connection is a call from HomeController, which appears to use it to show these enrollment totals, but the packet doesn't confirm how HomeController uses it."}]}, {"id": "dom:stores", "name": "Data stores", "kind": "domain", "children": [{"id": "ds:Person", "name": "SQL table Person", "kind": "datastore"}, {"id": "ds:Course", "name": "SQL table Course", "kind": "datastore"}, {"id": "ds:Department", "name": "SQL table Department", "kind": "datastore"}, {"id": "ds:Enrollment", "name": "SQL table Enrollment", "kind": "datastore"}, {"id": "ds:CourseAssignment", "name": "SQL table CourseAssignment", "kind": "datastore"}, {"id": "ds:OfficeAssignment", "name": "SQL table OfficeAssignment", "kind": "datastore"}, {"id": "ds:Notification", "name": "SQL table Notification", "kind": "datastore"}, {"id": "ds:MSMQ:ContosoUniversityNotifications", "name": "MSMQ private queue ContosoUniversityNotifications", "kind": "datastore"}, {"id": "ds:Disk:Uploads/TeachingMaterials", "name": "Disk folder ~/Uploads/TeachingMaterials", "kind": "datastore"}]}]}, "edges": [{"source": "BaseController", "target": "NotificationService", "kind": "call"}, {"source": "BaseController", "target": "SchoolContext", "kind": "call"}, {"source": "BaseController", "target": "SchoolContextFactory", "kind": "call"}, {"source": "Course", "target": "CourseAssignment", "kind": "call"}, {"source": "Course", "target": "Department", "kind": "call"}, {"source": "Course", "target": "Enrollment", "kind": "call"}, {"source": "CourseAssignment", "target": "Course", "kind": "call"}, {"source": "CourseAssignment", "target": "Instructor", "kind": "call"}, {"source": "CoursesController", "target": "BaseController", "kind": "call"}, {"source": "CoursesController", "target":   });
}
function renderFlowSidebar() {
  const f = activeFlow;
  sidebar.innerHTML = `
    <span class="closebtn" id="close">×</span>
    <h2>${esc(f.name)}</h2>
    <div class="meta">${f.persona ? "Persona: " + esc(f.persona) : ""}</div>
    ${f.description ? `<p style="font-size:13px">${esc(f.description)}</p>` : ""}
    <h3>Steps</h3>
    <ol>${f.steps.map(s => `<li>${esc(s.label)}${(s.nodes || []).length ?
      `<div class="meta">${s.nodes.map(id => esc(byId.get(id)?.name || id)).join(" → ")}</div>` : ""}</li>`).join("")}</ol>`;
  sidebar.classList.add("open");
  sidebar.querySelector("#close").onclick = () => setFlow("");
}

// ── Search ──────────────────────────────────────────────────────────────
const searchEl = document.getElementById("search"), resultsEl = document.getElementById("results");
searchEl.addEventListener("input", () => {
  const q = searchEl.value.trim().toLowerCase();
  resultsEl.innerHTML = "";
  if (q.length < 2) return;
  nodes.filter(n => n.name.toLowerCase().includes(q)).slice(0, 12).forEach(n => {
    const d = document.createElement("div");
    d.innerHTML = `${esc(n.name)}<span class="kind">${esc(n.kind)}</span>`;
    d.onclick = () => { selected = n.id; resultsEl.innerHTML = ""; flyTo(n); renderSidebar(); requestDraw(); };
    resultsEl.appendChild(d);
  });
});

// ── Edge-kind toggles & legend ──────────────────────────────────────────
const togglesEl = document.getElementById("toggles");
for (const [kind, style] of Object.entries(EDGE_STYLE)) {
  if (!edges.some(e => e.kind === kind)) continue;
  const solid = style.color.replace(/[\d.]+\)$/, "0.9)");
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" checked><span class="swatch" style="background:${solid}"></span>${style.label}`;
  l.querySelector("input").onchange = ev => { kindOn[kind] = ev.target.checked; requestDraw(); };
  togglesEl.appendChild(l);
}
if (!togglesEl.children.length) togglesEl.style.display = "none";

// ── Flows ───────────────────────────────────────────────────────────────
const flowsPanel = document.getElementById("flows"), flowSel = document.getElementById("flowSel");
const flows = (DATA.flows || []).filter(Boolean).map(f => ({
  ...f,
  steps: (Array.isArray(f.steps) ? f.steps : []).map(s => ({
    label: String(s?.label ?? ""), nodes: (s?.nodes || []).map(String) })),
}));
if (flows.length) {
  flowsPanel.style.display = "";
  flows.forEach((f, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = f.persona ? `${f.name} (${f.persona})` : f.name;
    flowSel.appendChild(o);
  });
  flowSel.onchange = () => setFlow(flowSel.value);
}
function setFlow(v) {
  flowSel.value = v;
  activeFlow = v === "" ? null : flows[+v];
  if (activeFlow && !activeFlow._seq) {
    activeFlow._seq = activeFlow.steps.flatMap(st => st.nodes);
    activeFlow._set = new Set(activeFlow._seq);
  }
  selected = null;
  if (activeFlow) {
    const ids = activeFlow.steps.flatMap(s => s.nodes || []);
    const pts = ids.map(id => byId.get(id)).filter(Boolean);
    if (pts.length) {
      const minX = Math.min(...pts.map(n => n.x - n.r)), maxX = Math.max(...pts.map(n => n.x + n.r));
      const minY = Math.min(...pts.map(n => n.y - n.r)), maxY = Math.max(...pts.map(n => n.y + n.r));
      flyTo({ x: (minX + maxX) / 2, y: (minY + maxY) / 2, r: Math.max(maxX - minX, maxY - minY) / 2 || 100 });
    }
  }
  renderSidebar(); requestDraw();
  if (!activeFlow) sidebar.classList.remove("open");
}

// ── Observations ────────────────────────────────────────────────────────
if ((DATA.observations || []).length) {
  document.getElementById("obs").style.display = "";
  document.getElementById("obsList").innerHTML =
    DATA.observations.map(o => `<li style="margin:4px 0">${esc(o)}</li>`).join("");
}

// ── Boot ────────────────────────────────────────────────────────────────
document.getElementById("title").textContent = DATA.system || DATA.root.name || "System topology";
{
  const leaves = nodes.filter(n => !n.container);
  const stores = leaves.filter(n => n.kind === "datastore").length;
  document.getElementById("stats").textContent =
    `${leaves.length - stores} modules` + (stores ? ` · ${stores} data stores` : "") +
    ` · ${edges.length} edges` + (entrySet.size ? ` · ${entrySet.size} entry points` : "");
}
{
  const vw = innerWidth, vh = innerHeight;
  const k = Math.min(vw, vh) / (WORLD * 1.05);
  sel.call(zoomB.transform, d3.zoomIdentity.translate(vw / 2 - WORLD / 2 * k, vh / 2 - WORLD / 2 * k).scale(k));
}
requestDraw();
</script>
</body>
</html>
